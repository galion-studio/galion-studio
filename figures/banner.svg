<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="GalionLabs — G.A.L.I.O.N. — galionOS">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="55%" stop-color="#020308"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="neb-indigo" cx="28%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-cyan" cx="74%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-violet" cx="54%" cy="78%" r="38%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
      .l1 { animation: lit 6s ease-in-out infinite 0.0s; }
      .l2 { animation: lit 6s ease-in-out infinite 0.35s; }
      .l3 { animation: lit 6s ease-in-out infinite 0.7s; }
      .l4 { animation: lit 6s ease-in-out infinite 1.05s; }
      .l5 { animation: lit 6s ease-in-out infinite 1.4s; }
      .l6 { animation: lit 6s ease-in-out infinite 1.75s; }
      @keyframes lit {
        0%, 100% { fill-opacity: 0.78; }
        30% { fill-opacity: 1; }
      }
      .tw1 { animation: tw 4.2s ease-in-out infinite; }
      .tw2 { animation: tw 5.6s ease-in-out infinite 1.4s; }
      .tw3 { animation: tw 3.8s ease-in-out infinite 2.3s; }
      @keyframes tw {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
      .spin {
        transform-origin: 640px 334px;
        animation: sp 2.4s linear infinite;
      }
      @keyframes sp {
        to { transform: rotate(360deg); }
      }
      .pulse {
        transform-origin: 640px 334px;
        animation: pl 3.6s ease-in-out infinite;
      }
      @keyframes pl {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .l1,.l2,.l3,.l4,.l5,.l6,.tw1,.tw2,.tw3,.spin,.pulse { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Deep space ground & breathing nebula clouds -->
  <rect width="1280" height="420" rx="18" fill="url(#space)"/>
  <rect width="1280" height="420" rx="18" fill="url(#neb-indigo)"/>
  <rect width="1280" height="420" rx="18" fill="url(#neb-cyan)"/>
  <rect width="1280" height="420" rx="18" fill="url(#neb-violet)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Starfield -->
  <g fill="#ffffff" class="tw1">
    <circle cx="96" cy="68" r="1.2"/><circle cx="214" cy="128" r="0.9"/><circle cx="348" cy="54" r="1.4"/>
    <circle cx="512" cy="44" r="0.8"/><circle cx="786" cy="58" r="1.1"/><circle cx="962" cy="84" r="1.5"/>
    <circle cx="1142" cy="64" r="1.0"/><circle cx="1194" cy="182" r="1.3"/><circle cx="144" cy="312" r="1.1"/>
    <circle cx="1084" cy="336" r="1.2"/><circle cx="312" cy="356" r="0.9"/><circle cx="892" cy="364" r="1.0"/>
  </g>
  <g fill="#dbeafe" class="tw2">
    <circle cx="164" cy="196" r="1.3"/><circle cx="278" cy="248" r="1.0"/><circle cx="436" cy="96" r="1.1"/>
    <circle cx="848" cy="112" r="1.2"/><circle cx="1038" cy="212" r="1.4"/><circle cx="1168" cy="284" r="0.9"/>
    <circle cx="78" cy="254" r="1.0"/><circle cx="468" cy="348" r="1.1"/><circle cx="798" cy="318" r="1.2"/>
  </g>
  <g fill="#67e8f9" class="tw3">
    <circle cx="238" cy="76" r="1.1"/><circle cx="1014" cy="134" r="1.2"/>
    <circle cx="192" cy="366" r="1.0"/><circle cx="1098" cy="246" r="1.1"/>
  </g>

  <!-- GalionLabs -->
  <text x="640" y="64" text-anchor="middle" class="f" fill="#ffffff" fill-opacity="0.72" font-size="14" font-weight="300" letter-spacing="7">GalionLabs</text>

  <!-- G.A.L.I.O.N. -->
  <text x="650" y="150" text-anchor="middle" class="f" fill="#ffffff" font-size="56" font-weight="200" letter-spacing="18" filter="url(#soft-glow)">
    <tspan class="l1">G.</tspan><tspan class="l2">A.</tspan><tspan class="l3">L.</tspan><tspan class="l4">I.</tspan><tspan class="l5">O.</tspan><tspan class="l6">N.</tspan>
  </text>

  <!-- Full name -->
  <text x="643" y="188" text-anchor="middle" class="f" fill="#ffffff" fill-opacity="0.72" font-size="11.5" font-weight="300" letter-spacing="5.2">GENERAL AUTONOMOUS LOCAL INTELLIGENCE OPEN NETWORK</text>

  <!-- Subtle horizon line -->
  <rect x="340" y="216" width="600" height="1" fill="url(#line-fade)"/>

  <!-- Vision line from boot sequence -->
  <text x="644" y="254" text-anchor="middle" class="f" fill="#67e8f9" fill-opacity="0.92" font-size="13.5" font-weight="300" letter-spacing="6.5">YOUR ONLY LIMIT IS YOUR IMAGINATION</text>

  <!-- galionOS + spinning ring + Obsidian Desktop · Open Mind stack -->
  <text x="642" y="302" text-anchor="middle" class="f" fill="#ffffff" fill-opacity="0.88" font-size="22" font-weight="300" letter-spacing="4">galionOS</text>

  <circle cx="640" cy="334" r="16" fill="#3b82f6" fill-opacity="0.18" class="pulse" filter="url(#soft-glow)"/>
  <circle cx="640" cy="334" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2.5"/>
  <circle cx="640" cy="334" r="13" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="48 36" class="spin"/>
  <circle cx="640" cy="334" r="2.5" fill="#ffffff"/>

  <text x="642" y="378" text-anchor="middle" class="f" fill="#a5b4fc" fill-opacity="0.82" font-size="11.5" font-weight="300" letter-spacing="3.5">OBSIDIAN DESKTOP  ·  OPEN MIND STACK  ·  LINUX</text>
</svg>
