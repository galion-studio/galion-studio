<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="galionOS, Obsidian Desktop, Open Mind stack, Galion One and Galion Research">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="540" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="539" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Section Title -->
  <text x="48" y="46" class="f" fill="#67e8f9" font-size="11.5" font-weight="500" letter-spacing="4">HOW GALION WORKS</text>
  <text x="48" y="74" class="f" fill="#ffffff" fill-opacity="0.7" font-size="15" font-weight="300">Two apps on Obsidian Desktop, powered by the Open Mind and Voice stacks, running on galionOS Linux.</text>

  <!-- LAYER 1: THE TWO APPS -->
  <!-- App 1: Galion One -->
  <rect x="48" y="102" width="576" height="132" rx="14" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.45"/>
  <circle cx="88" cy="142" r="14" fill="#3b82f6" fill-opacity="0.15"/>
  <circle cx="88" cy="142" r="6" fill="#ffffff"/>
  <text x="118" y="140" class="f" fill="#ffffff" font-size="22" font-weight="400" letter-spacing="0.5">Galion One</text>
  <text x="118" y="160" class="f" fill="#67e8f9" font-size="11.5" font-weight="500" letter-spacing="2">FREE &amp; OPEN SOURCE  ·  OPTIONAL PLUS PLAN</text>
  <text x="72" y="194" class="f" fill="#ffffff" fill-opacity="0.72" font-size="14" font-weight="300">Your personal AI companion across phone, laptop, and web.</text>
  <text x="72" y="214" class="f" fill="#ffffff" fill-opacity="0.52" font-size="13" font-weight="300">Speaks and listens naturally through the built-in Galion Voice stack.</text>

  <!-- App 2: Galion Research -->
  <rect x="656" y="102" width="576" height="132" rx="14" fill="#0b0f19" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <polygon points="696,127 711,142 696,157 681,142" fill="#8b5cf6" fill-opacity="0.15" stroke="#a5b4fc" stroke-width="1.5"/>
  <circle cx="696" cy="142" r="3.5" fill="#ffffff"/>
  <text x="726" y="140" class="f" fill="#ffffff" font-size="22" font-weight="400" letter-spacing="0.5">Galion Research</text>
  <text x="726" y="160" class="f" fill="#a5b4fc" font-size="11.5" font-weight="500" letter-spacing="2">FREE &amp; OPEN SOURCE  ·  OPTIONAL ULTRA PLAN</text>
  <text x="680" y="194" class="f" fill="#ffffff" fill-opacity="0.72" font-size="14" font-weight="300">Deep research workspace for big questions, papers, and experiments.</text>
  <text x="680" y="214" class="f" fill="#ffffff" fill-opacity="0.52" font-size="13" font-weight="300">Honest citations — clearly separates Found, Inferred, and Unknown.</text>

  <!-- Connectors down to Obsidian Desktop -->
  <line x1="336" y1="234" x2="336" y2="258" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="944" y1="234" x2="944" y2="258" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- LAYER 2: OBSIDIAN DESKTOP + STACKS -->
  <rect x="48" y="258" width="1184" height="156" rx="14" fill="#090d16" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="72" y="290" class="f" fill="#ffffff" font-size="19" font-weight="400" letter-spacing="2">Obsidian Desktop</text>
  <text x="278" y="289" class="f" fill="#ffffff" fill-opacity="0.5" font-size="13" font-weight="300">— One calm, distraction-free workspace where your stacks live together</text>

  <!-- Stack Box 1: Open Mind stack -->
  <rect x="72" y="308" width="368" height="86" rx="10" fill="#101726" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="92" y="335" class="f" fill="#67e8f9" font-size="15" font-weight="500" letter-spacing="0.5">Open Mind stack</text>
  <text x="92" y="357" class="f" fill="#ffffff" fill-opacity="0.7" font-size="12.5" font-weight="300">Agents, local memory, tools, and security.</text>
  <text x="92" y="376" class="f" fill="#ffffff" fill-opacity="0.48" font-size="12" font-weight="300">Light and fast in Rust on any ordinary CPU.</text>

  <!-- Stack Box 2: Galion Voice stack -->
  <rect x="456" y="308" width="368" height="86" rx="10" fill="#101726" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="476" y="335" class="f" fill="#c4b5fd" font-size="15" font-weight="500" letter-spacing="0.5">Galion Voice stack</text>
  <text x="476" y="357" class="f" fill="#ffffff" fill-opacity="0.7" font-size="12.5" font-weight="300">Real-time voice, natural speech, and live empathy.</text>
  <text x="476" y="376" class="f" fill="#ffffff" fill-opacity="0.48" font-size="12" font-weight="300">Built right into Galion One — one breathing orb.</text>

  <!-- Stack Box 3: Galion Knowledge -->
  <rect x="840" y="308" width="368" height="86" rx="10" fill="#101726" stroke="#a5b4fc" stroke-opacity="0.3"/>
  <text x="860" y="335" class="f" fill="#a5b4fc" font-size="15" font-weight="500" letter-spacing="0.5">Galion Knowledge</text>
  <text x="860" y="357" class="f" fill="#ffffff" fill-opacity="0.7" font-size="12.5" font-weight="300">Verified world-knowledge pack &amp; truth gate.</text>
  <text x="860" y="376" class="f" fill="#ffffff" fill-opacity="0.48" font-size="12" font-weight="300">Offline memory with real sources, never guesses.</text>

  <!-- Connector down to galionOS -->
  <line x1="640" y1="414" x2="640" y2="438" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- LAYER 3: galionOS (LINUX) -->
  <rect x="48" y="438" width="1184" height="74" rx="14" fill="#0b0f19" stroke="url(#accent-blue)" stroke-opacity="0.6"/>
  <circle cx="84" cy="475" r="10" fill="none" stroke="url(#accent-blue)" stroke-width="2.2"/>
  <circle cx="84" cy="475" r="2.5" fill="#ffffff"/>
  <text x="110" y="473" class="f" fill="#ffffff" font-size="20" font-weight="300" letter-spacing="3">galionOS</text>
  <text x="236" y="472" class="f" fill="#67e8f9" font-size="11.5" font-weight="500" letter-spacing="2.5">LINUX  ·  RUST  ·  FREE FOREVER  ·  PERPETUAL OPEN MIT</text>
  <text x="110" y="495" class="f" fill="#ffffff" fill-opacity="0.62" font-size="13.5" font-weight="300">Runs on laptops, desktops, and Raspberry Pi 5. Works offline. No email needed — your hardware, your AI.</text>
</svg>
